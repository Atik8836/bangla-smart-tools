
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Smart Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#172033}
header{background:#123c69;color:white;text-align:center;padding:30px 15px}
header h1{margin:0 0 10px}
main{max-width:900px;margin:25px auto;padding:15px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:white;padding:20px;border-radius:14px;box-shadow:0 3px 12px #0001}
h2{color:#123c69;margin-top:0}
input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
button:hover{background:#0e4d80}
.result{font-weight:bold;color:#087443;min-height:24px}
footer{text-align:center;padding:25px;color:#64748b}
</style>
</head>
<body>
<header>
<h1>Bangla Smart Tools</h1>
<p>আপনার দৈনন্দিন কাজের সহজ অনলাইন টুলস</p>
</header>

<main>
<div class="tools">

<section class="card">
<h2>🧮 Calculator</h2>
<input id="calcDisplay" placeholder="যেমন: 100+50">
<button onclick="calculate()">হিসাব করুন</button>
<p class="result" id="calcResult"></p>
</section>

<section class="card">
<h2>🎂 Age Calculator</h2>
<input type="date" id="birthDate">
<button onclick="calculateAge()">বয়স হিসাব করুন</button>
<p class="result" id="ageResult"></p>
</section>

<section class="card">
<h2>📝 Word Counter</h2>
<input id="wordText" placeholder="এখানে লিখুন">
<button onclick="countWords()">শব্দ গণনা করুন</button>
<p class="result" id="wordResult"></p>
</section>

<section class="card">
<h2>📏 Unit Converter</h2>
<input type="number" id="meterValue" placeholder="মিটার লিখুন">
<button onclick="convertUnit()">ফলাফল দেখুন</button>
<p class="result" id="unitResult"></p>
</section>

<section class="card">
<h2>💰 Salary Calculator</h2>
<input type="number" id="salary" placeholder="মূল বেতন">
<input type="number" id="bonus" placeholder="অতিরিক্ত টাকা">
<input type="number" id="deduction" placeholder="কর্তন">
<button onclick="calculateSalary()">বেতন হিসাব করুন</button>
<p class="result" id="salaryResult"></p>
</section>

</div>
</main>

<footer>© 2026 Bangla Smart Tools | All Rights Reserved</footer>

<script>
function calculate(){
try{
const expression=document.getElementById("calcDisplay").value;
if(!/^[0-9+\-*/().\s]+$/.test(expression)) throw new Error();
const result=Function('"use strict";return ('+expression+')')();
if(!Number.isFinite(result)) throw new Error();
document.getElementById("calcResult").textContent="ফলাফল: "+result;
}catch(e){
document.getElementById("calcResult").textContent="সঠিক হিসাব লিখুন";
}
}

function calculateAge(){
const value=document.getElementById("birthDate").value;
const result=document.getElementById("ageResult");
if(!value){result.textContent="জন্মতারিখ নির্বাচন করুন";return;}
const birth=new Date(value+"T00:00:00");
const today=new Date();
if(birth>today){result.textContent="ভবিষ্যতের তারিখ দেওয়া যাবে না";return;}
let years=today.getFullYear()-birth.getFullYear();
let months=today.getMonth()-birth.getMonth();
let days=today.getDate()-birth.getDate();
if(days<0){
months--;
days+=new Date(today.getFullYear(),today.getMonth(),0).getDate();
}
if(months<0){years--;months+=12;}
result.textContent=`আপনার বয়স: ${years} বছর, ${months} মাস, ${days} দিন`;
}

function countWords(){
const text=document.getElementById("wordText").value.trim();
const words=text?text.split(/\s+/).length:0;
document.getElementById("wordResult").textContent="শব্দ: "+words+" | অক্ষর: "+text.length;
}

function convertUnit(){
const value=Number(document.getElementById("meterValue").value);
document.getElementById("unitResult").textContent=
Number.isFinite(value)&&document.getElementById("meterValue").value!==""
?value+" মিটার = "+(value*100).toFixed(2)+" সেন্টিমিটার"
:"সঠিক সংখ্যা লিখুন";
}

function calculateSalary(){
const salary=Number(document.getElementById("salary").value)||0;
const bonus=Number(document.getElementById("bonus").value)||0;
const deduction=Number(document.getElementById("deduction").value)||0;
document.getElementById("salaryResult").textContent=
"মোট বেতন: ৳"+(salary+bonus-deduction).toFixed(2);
}
</script>
</body>
</html>
</html>
